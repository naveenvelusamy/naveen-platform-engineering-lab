trigger:
- develop
- feature/*

pool:
  vmImage: ubuntu-latest

steps:
- task: NodeTool@0
  inputs:
    versionSpec: "24.21.0"
  displayName: "Installing the Nodejs"


- script: npm ci
  displayName: "Install dependencies"


- script: npm run lint
  displayName: "Run lint"

- script: npm run build
  displayName: "Build Next.js application"